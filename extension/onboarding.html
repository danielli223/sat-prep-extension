<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focused Practice — Welcome</title>
    <style>
      :root {
        --teal-dark: #16323a;
        --teal: #3f9bab;
        --cream: #f7e6a3;
        --cream-bg: #fdfbf3;
      }
      * { box-sizing: border-box; }
      body {
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 56px 20px;
        background: linear-gradient(180deg, var(--cream-bg), #ffffff 320px);
        color: #1f2a2d;
      }
      .fp-card {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        padding: 32px 36px 36px;
        box-shadow: 0 1px 3px rgba(22, 50, 58, 0.08), 0 12px 32px rgba(22, 50, 58, 0.08);
        border: 1px solid rgba(22, 50, 58, 0.06);
      }
      .fp-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }
      .fp-header img { width: 44px; height: 44px; flex-shrink: 0; }
      .fp-header h1 {
        font-size: 19px;
        font-weight: 700;
        color: var(--teal-dark);
        margin: 0;
        letter-spacing: -0.01em;
      }
      .fp-telemetry {
        background: var(--cream-bg);
        border: 1px solid rgba(22, 50, 58, 0.08);
        border-radius: 12px;
        padding: 18px 20px;
        margin: 0 0 26px;
      }
      .fp-telemetry p { margin: 0 0 14px; color: #33454a; font-size: 13.5px; }
      /* Deliberately NOT bold — the emphasis belongs to the promise below it, not the ask. */
      .fp-telemetry-lead { color: #1f2a2d !important; }
      /* The Limited Use promise — emphasised on purpose: it is the reassurance students act on. */
      .fp-telemetry-promise {
        background: rgba(22, 122, 138, 0.08);
        border-left: 3px solid var(--teal);
        border-radius: 0 8px 8px 0;
        padding: 10px 12px;
        font-weight: 600;
        color: var(--teal-dark) !important;
      }
      /* The full disclosure — quieter, but never hidden or collapsed. */
      .fp-telemetry-detail { font-size: 12.5px !important; color: #5b6b70 !important; }
      .fp-telemetry label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0;
        font-size: 13.5px;
        color: #1f2a2d;
      }
      .fp-telemetry input[type="checkbox"] { accent-color: var(--teal); width: 15px; height: 15px; }
      .fp-telemetry-delete {
        background: none;
        border: none;
        color: var(--teal-dark);
        text-decoration: underline;
        font-size: 12.5px;
        padding: 0;
        margin-top: 6px;
        cursor: pointer;
        opacity: 0.75;
      }
      .fp-telemetry-delete:hover { opacity: 1; }
      .fp-onboarding-continue {
        display: block;
        width: 100%;
        background: var(--teal-dark);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .fp-onboarding-continue:hover { background: #0f2429; }
    </style>
  </head>
  <body>
    <div class="fp-card">
      <div class="fp-header">
        <img src="icons/icon128.png" alt="Focused Practice logo" />
        <h1>Focused Practice</h1>
      </div>
      <div id="root"></div>
    </div>
    <script src="onboarding.js"></script>
  </body>
</html>
