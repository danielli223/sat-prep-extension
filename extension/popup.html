<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focused Practice</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 240px; }
      .fp-open-qb { display: block; margin-bottom: 8px; }
      .fp-open-journal { display: block; width: 100%; padding: 6px; margin-bottom: 8px; }
      .fp-notice { color: #666; font-size: 11px; margin: 0; }
      /* Consent surface. The popup is narrow (240px), so the disclosure is sized down but never
         truncated, collapsed, or put behind a "learn more" — it must be readable AT the decision. */
      .fp-telemetry { border-top: 1px solid #e3e3e3; margin-top: 10px; padding-top: 10px; }
      .fp-telemetry p { margin: 0 0 8px; }
      /* Deliberately NOT bold — the emphasis belongs to the promise below it, not the ask. */
      .fp-telemetry-lead { font-size: 12.5px; color: #1f2a2d; }
      .fp-telemetry-promise {
        background: #eef6f7;
        border-left: 3px solid #167a8a;
        border-radius: 0 6px 6px 0;
        padding: 7px 9px;
        font-size: 11.5px;
        font-weight: 600;
        color: #10525d;
      }
      .fp-telemetry-detail { font-size: 10.5px; line-height: 1.35; color: #666; }
      .fp-telemetry label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 6px 0; }
      .fp-telemetry-delete {
        background: none; border: none; padding: 0; margin-top: 4px;
        color: #10525d; text-decoration: underline; font-size: 11px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
